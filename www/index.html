<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2b3a2b">
  <title>Factoría 2D</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="topbar">
    <div id="powerStat" class="stat"></div>
    <button id="msStat" class="stat clickable"></button>
    <div class="spacer"></div>
    <button id="invBtn" class="stat clickable"></button>
    <button id="menuBtn" class="stat clickable"></button>
  </div>

  <div id="missionHud" class="hidden"></div>

  <div id="hint" class="hidden"></div>

  <div id="powerBanner" class="hidden">
    ¡Red sobrecargada! La demanda supera la generación: añade o alimenta generadores.
  </div>

  <div id="modebar">
    <button data-mode="select" class="active" title="Seleccionar / mover"></button>
    <button data-mode="build" title="Construir"></button>
    <button data-mode="belt" title="Cintas"></button>
    <button data-mode="demolish" title="Demoler"></button>
  </div>

  <div id="confirmBar" class="hidden">
    <button id="ghostOk">Construir</button>
    <button id="ghostCancel">Cancelar</button>
  </div>

  <div id="linkBar" class="hidden">
    <button id="linkCancel">Cancelar trazado</button>
  </div>

  <div id="palette" class="hidden"></div>

  <div id="sheet" class="hidden">
    <div id="sheetHead">
      <span id="sheetTitle"></span>
      <button id="sheetClose"></button>
    </div>
    <div id="sheetBody"></div>
  </div>

  <div id="toasts"></div>

  <div id="victory" class="hidden">
    <div class="v-card">
      <h1>¡ASCENSOR ESPACIAL COMPLETADO!</h1>
      <p>Has enviado las dos fases del proyecto. FICSIT está orgullosa de ti, ingeniero.</p>
      <div id="vStats"></div>
      <button id="vContinue" class="btn">Seguir construyendo</button>
    </div>
  </div>

  <div id="intro" class="hidden">
    <canvas id="introCanvas"></canvas>
    <button id="introSkip">Saltar intro</button>
  </div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
